[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "longplay"
version = "0.1.0"
description = "Tiny OpenAI-compatible agent harness plus a workout-length album picker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
longplay = "apps.workout_album.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*", "apps*", "examples*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
