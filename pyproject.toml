[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "longplay"
version = "0.1.0"
description = "Session Soundtrack picker. The agent loop is Strands; album runtime is ours."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.57",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
longplay = "apps.workout_album.__main__:main"

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
