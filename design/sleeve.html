<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>longplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --text: #ededed;
      --mute: #888;
      --line: rgba(255, 255, 255, 0.14);
      --glass: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Geist, Inter, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(520px 360px at 18% 12%, rgba(150, 180, 255, 0.22), transparent 62%),
        radial-gradient(460px 340px at 86% 78%, rgba(255, 255, 255, 0.1), transparent 60%);
    }

    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      left: 50%;
      top: 42%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22), rgba(140, 170, 255, 0.08) 42%, transparent 70%);
      filter: blur(8px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .orb { animation: drift 16s ease-in-out infinite; }
    }

    @keyframes drift {
      50% { transform: translate(-42%, -58%) scale(1.08); }
    }

    .card {
      position: relative;
      width: min(100%, 420px);
      padding: 28px 22px 22px;
      overflow: hidden;
      border-radius: 28px;
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
    }

    .mark {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--mute);
    }

    .stage {
      position: relative;
      height: 276px;
      margin: 8px -22px 0;
      overflow: hidden;
    }

    .clock,
    .reel {
      position: absolute;
      inset: 0;
      transition: opacity 460ms ease, transform 460ms ease;
    }

    .clock {
      display: grid;
      place-items: center;
    }

    .reel {
      opacity: 0;
      pointer-events: none;
      transform: translateX(36px);
    }

    .stage.show-reel .clock {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .stage.show-reel .reel {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .stage.searching .disc { pointer-events: none; cursor: default; }

    .disc {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -18px 40px rgba(255, 255, 255, 0.04);
      touch-action: none;
      cursor: pointer;
    }

    .gauge {
      position: absolute;
      inset: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
    }

    .rail,
    .fill {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .rail { stroke: rgba(255, 255, 255, 0.16); }

    .fill {
      stroke: #fff;
      transform: rotate(-90deg);
      transform-origin: 110px 110px;
    }

    .stage.searching .fill {
      stroke-dasharray: 128 476 !important;
      stroke-dashoffset: 0 !important;
      animation: sweep 0.9s linear infinite;
    }

    .stage.searching .thumb { opacity: 0; }

    @keyframes sweep {
      from { transform: rotate(-90deg); }
      to { transform: rotate(270deg); }
    }

    .thumb {
      fill: #fff;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    }

    .hub {
      position: absolute;
      inset: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .face,
    .phrase {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage.searching .face {
      opacity: 0;
      transform: translateY(-6px);
    }

    .minutes {
      display: block;
      width: 150px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font: 600 68px/0.95 Geist, Inter, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      text-align: center;
      pointer-events: auto;
      cursor: text;
    }

    .minutes:focus { outline: none; }

    .unit {
      margin-top: 4px;
      font-size: 13px;
      color: var(--mute);
    }

    .phrase {
      position: absolute;
      left: 18px;
      right: 18px;
      margin: 0;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0;
      transform: translateY(8px);
    }

    .phrase.on {
      opacity: 1;
      transform: none;
    }

    .reel-track {
      position: absolute;
      left: 0;
      top: 50%;
      display: flex;
      gap: 22px;
      height: 208px;
      margin-top: -104px;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
      cursor: grab;
    }

    .reel-track.dragging {
      transition: none;
      cursor: grabbing;
    }

    .sleeve {
      flex: 0 0 208px;
      width: 208px;
      height: 208px;
      padding: 0;
      border: 0;
      background: none;
      cursor: inherit;
    }

    .sleeve:focus-visible .cover {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      opacity: 0.42;
      transform: scale(0.84);
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1), opacity 420ms ease, box-shadow 420ms ease;
      background:
        radial-gradient(circle at 50% 50%, #070709 0 7px, rgba(0, 0, 0, 0.45) 8px 16px, transparent 17px),
        repeating-radial-gradient(circle at 50% 50%, transparent 0 13px, rgba(255, 255, 255, 0.09) 14px 15px),
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.42), transparent 34%),
        var(--tone);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .sleeve.active .cover {
      opacity: 1;
      transform: none;
      box-shadow:
        0 0 0 2px #fff,
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .caption {
      margin-top: 6px;
      text-align: center;
    }

    .caption[hidden] { display: none; }

    .kicker {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .facts {
      margin: 8px 0 0;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .why {
      margin: 6px auto 0;
      max-width: 32ch;
      font-size: 13px;
      line-height: 1.4;
      color: #b7b7b7;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      cursor: pointer;
    }

    .dot.on { background: #fff; }

    .liner {
      height: 48px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      transition: height 280ms ease, margin-top 280ms ease, opacity 280ms ease, background-color 280ms ease, border-color 280ms ease;
    }

    .card.results .liner {
      height: 0;
      margin-top: 0;
      opacity: 0;
      border-width: 0;
      pointer-events: none;
    }

    .liner.open {
      height: 156px;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .liner textarea {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font: 400 16px/24px Geist, Inter, sans-serif;
      padding: 12px 14px;
    }

    .liner.open textarea { overflow: auto; }

    .liner textarea:focus { outline: none; }
    .liner textarea::placeholder { color: #666; }

    .again {
      display: block;
      width: 100%;
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font: 500 15px/1 Geist, Inter, sans-serif;
      padding: 14px 20px;
      cursor: pointer;
    }

    .again[hidden] { display: none; }
    .again:hover { background: rgba(255, 255, 255, 0.12); }

    .play {
      display: block;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font: 500 15px/1 Geist, Inter, sans-serif;
      padding: 14px 20px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play:hover { background: #e8e8e8; }
    .play:active { background: #d4d4d4; }
    .play:disabled { cursor: default; background: rgba(255, 255, 255, 0.72); }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      .stage.searching .fill { animation: none; }
      .clock,
      .reel,
      .cover,
      .face,
      .phrase,
      .reel-track,
      .liner { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true"><div class="orb"></div></div>
  <main class="card" id="card">
    <p class="mark">longplay</p>
    <div class="stage" id="stage">
      <div class="clock" id="clock">
        <div class="disc" id="track" role="slider" aria-valuemin="5" aria-valuemax="240" aria-valuenow="45" aria-label="Session length" tabindex="0">
          <svg class="gauge" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="rail" cx="110" cy="110" r="96" />
            <circle class="fill" id="fill" cx="110" cy="110" r="96" />
            <circle class="thumb" id="thumb" r="7" />
          </svg>
          <div class="hub">
            <div class="face" id="face">
              <input class="minutes" id="minutes" inputmode="numeric" aria-label="Session length in minutes" value="45" />
              <div class="unit">minutes</div>
            </div>
            <p class="phrase" id="phrase" aria-live="polite"></p>
          </div>
        </div>
      </div>
      <div class="reel" id="reel" aria-hidden="true">
        <div class="reel-track" id="reelTrack"></div>
      </div>
    </div>
    <div class="caption" id="caption" hidden>
      <p class="kicker" id="kicker"></p>
      <p class="facts" id="facts"></p>
      <p class="why" id="why"></p>
      <div class="dots" id="dots"></div>
    </div>
    <div class="liner" id="liner">
      <textarea id="criteria" rows="4" placeholder="What you want to hear"></textarea>
    </div>
    <button class="again" id="again" type="button" hidden>Look for something else</button>
    <button class="play" id="play" type="button">Press play</button>
  </main>
  <script>
    const MIN = 5;
    const MAX = 240;
    const RADIUS = 96;
    const CENTER = 110;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
    const SLEEVE = 208;
    const GAP = 22;
    const LINES = [
      "Looking across the shelf",
      "Measuring the runtime",
      "Keeping the clock",
      "One that follows the ask",
    ];
    const TONES = ["#2c4f8a", "#4a3058", "#1d4038", "#5a3a2c", "#2e3848"];

    const card = document.getElementById("card");
    const stage = document.getElementById("stage");
    const clock = document.getElementById("clock");
    const reel = document.getElementById("reel");
    const reelTrack = document.getElementById("reelTrack");
    const minutes = document.getElementById("minutes");
    const track = document.getElementById("track");
    const fill = document.getElementById("fill");
    const thumb = document.getElementById("thumb");
    const phrase = document.getElementById("phrase");
    const liner = document.getElementById("liner");
    const criteria = document.getElementById("criteria");
    const play = document.getElementById("play");
    const again = document.getElementById("again");
    const caption = document.getElementById("caption");
    const kicker = document.getElementById("kicker");
    const facts = document.getElementById("facts");
    const why = document.getElementById("why");
    const dots = document.getElementById("dots");

    let mode = "time";
    let timers = [];
    let albums = [];
    let index = 0;
    let drag = null;

    function clamp(value) {
      const number = Math.round(Number(value));
      if (!Number.isFinite(number)) return MIN;
      return Math.min(MAX, Math.max(MIN, number));
    }

    function later(fn, ms) {
      const id = setTimeout(fn, ms);
      timers.push(id);
    }

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
    }

    function paint(value) {
      const next = clamp(value);
      const ratio = (next - MIN) / (MAX - MIN);
      fill.style.strokeDasharray = String(CIRCUMFERENCE);
      fill.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - ratio));
      const angle = -Math.PI / 2 + ratio * Math.PI * 2;
      thumb.setAttribute("cx", String(CENTER + RADIUS * Math.cos(angle)));
      thumb.setAttribute("cy", String(CENTER + RADIUS * Math.sin(angle)));
      track.setAttribute("aria-valuenow", String(next));
      if (document.activeElement !== minutes) minutes.value = String(next);
      return next;
    }

    function seek(clientX, clientY) {
      const rect = track.getBoundingClientRect();
      const angle = Math.atan2(clientY - (rect.top + rect.height / 2), clientX - (rect.left + rect.width / 2));
      let fromTop = angle + Math.PI / 2;
      if (fromTop < 0) fromTop += Math.PI * 2;
      paint(MIN + (fromTop / (Math.PI * 2)) * (MAX - MIN));
    }

    function lineup(session) {
      const n = clamp(session);
      const rows = [
        ["Night Window", "Mina Sol", 2004, n, true, "Follows the ask, and the runtime lands inside the session."],
        ["Glass Arcade", "Keller & June", 2006, Math.max(MIN, n - 2), false, "Also fits the clock."],
        ["Soft Voltage", "Patio Radio", 2001, Math.min(MAX, n + 1), false, "Also fits the clock."],
        ["Second Street", "The Late Set", 2008, Math.max(MIN, n - 4), false, "Also fits the clock."],
        ["Open Late", "Camila Voss", 2003, Math.min(MAX, n + 3), false, "Also fits the clock."],
      ];
      return rows.map((row, i) => ({
        title: row[0],
        artist: row[1],
        year: row[2],
        minutes: row[3],
        lead: row[4],
        why: row[5],
        tone: TONES[i],
      }));
    }

    function offsetFor(next) {
      return (stage.clientWidth - SLEEVE) / 2 - next * (SLEEVE + GAP);
    }

    function renderAlbum(next) {
      index = Math.max(0, Math.min(albums.length - 1, next));
      reelTrack.style.transform = "translateX(" + offsetFor(index) + "px)";
      Array.from(reelTrack.children).forEach((sleeve, i) => {
        sleeve.classList.toggle("active", i === index);
        sleeve.tabIndex = i === index ? 0 : -1;
      });
      Array.from(dots.children).forEach((dot, i) => {
        dot.classList.toggle("on", i === index);
      });
      const album = albums[index];
      kicker.textContent = album.lead ? "Recommendation" : "Also fits";
      facts.textContent = album.artist + " · " + album.year + " · " + album.minutes + " min";
      why.textContent = album.why;
      play.textContent = album.title;
    }

    function buildReel(session) {
      albums = lineup(session);
      index = 0;
      reelTrack.replaceChildren();
      dots.replaceChildren();
      albums.forEach((album, i) => {
        const sleeve = document.createElement("button");
        sleeve.type = "button";
        sleeve.className = "sleeve";
        sleeve.dataset.index = String(i);
        sleeve.setAttribute("aria-label", album.title + " by " + album.artist);
        const cover = document.createElement("span");
        cover.className = "cover";
        cover.style.setProperty("--tone", album.tone);
        sleeve.appendChild(cover);
        reelTrack.appendChild(sleeve);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot";
        dot.setAttribute("aria-label", "Show " + album.title);
        dot.addEventListener("click", () => renderAlbum(i));
        dots.appendChild(dot);
      });
      renderAlbum(0);
    }

    function showPhrase(text) {
      phrase.classList.remove("on");
      later(() => {
        phrase.textContent = text;
        phrase.classList.add("on");
      }, 160);
    }

    function reveal() {
      mode = "albums";
      stage.classList.remove("searching");
      phrase.classList.remove("on");
      buildReel(minutes.value);
      stage.classList.add("show-reel");
      clock.setAttribute("aria-hidden", "true");
      reel.removeAttribute("aria-hidden");
      caption.hidden = false;
      again.hidden = false;
      criteria.blur();
      card.classList.add("results");
      liner.setAttribute("aria-hidden", "true");
      play.disabled = false;
      track.removeAttribute("aria-busy");
    }

    function search() {
      if (mode !== "time") return;
      if (!criteria.value.trim()) {
        criteria.focus();
        return;
      }
      mode = "search";
      clearTimers();
      stage.classList.add("searching");
      track.setAttribute("aria-busy", "true");
      play.disabled = true;
      play.textContent = "Looking";
      minutes.blur();
      LINES.forEach((line, i) => later(() => showPhrase(line), i * 620));
      later(reveal, LINES.length * 620 + 80);
    }

    function restore() {
      clearTimers();
      mode = "time";
      stage.classList.remove("searching", "show-reel");
      phrase.classList.remove("on");
      phrase.textContent = "";
      clock.removeAttribute("aria-hidden");
      reel.setAttribute("aria-hidden", "true");
      caption.hidden = true;
      again.hidden = true;
      card.classList.remove("results");
      liner.removeAttribute("aria-hidden");
      play.disabled = false;
      play.textContent = "Press play";
      track.removeAttribute("aria-busy");
      paint(minutes.value);
    }

    minutes.addEventListener("focus", () => minutes.select());
    minutes.addEventListener("input", () => {
      minutes.value = minutes.value.replace(/\D/g, "").slice(0, 3);
    });
    minutes.addEventListener("change", () => {
      minutes.value = String(paint(minutes.value));
    });
    minutes.addEventListener("keydown", (event) => {
      if (event.key === "Enter") minutes.blur();
    });

    track.addEventListener("pointerdown", (event) => {
      if (mode !== "time" || event.target === minutes) return;
      track.setPointerCapture(event.pointerId);
      seek(event.clientX, event.clientY);
    });
    track.addEventListener("pointermove", (event) => {
      if (mode === "time" && track.hasPointerCapture(event.pointerId)) seek(event.clientX, event.clientY);
    });
    track.addEventListener("keydown", (event) => {
      if (mode !== "time") return;
      const current = Number(track.getAttribute("aria-valuenow"));
      if (event.key === "ArrowRight" || event.key === "ArrowUp") paint(current + 5);
      if (event.key === "ArrowLeft" || event.key === "ArrowDown") paint(current - 5);
    });

    reelTrack.addEventListener("pointerdown", (event) => {
      if (mode !== "albums") return;
      drag = { id: event.pointerId, x: event.clientX, origin: offsetFor(index), moved: false };
      reelTrack.setPointerCapture(event.pointerId);
      reelTrack.classList.add("dragging");
    });
    reelTrack.addEventListener("pointermove", (event) => {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x;
      if (Math.abs(dx) > 5) drag.moved = true;
      reelTrack.style.transform = "translateX(" + (drag.origin + dx) + "px)";
    });
    function endDrag(event) {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x;
      const moved = drag.moved;
      drag = null;
      reelTrack.classList.remove("dragging");
      if (!moved) {
        const sleeve = event.target.closest(".sleeve");
        if (sleeve) renderAlbum(Number(sleeve.dataset.index));
        else renderAlbum(index);
        return;
      }
      renderAlbum(index - Math.round(dx / (SLEEVE + GAP)));
    }
    reelTrack.addEventListener("pointerup", endDrag);
    reelTrack.addEventListener("pointercancel", endDrag);

    document.addEventListener("keydown", (event) => {
      if (mode !== "albums") return;
      if (event.key === "ArrowRight") renderAlbum(index + 1);
      if (event.key === "ArrowLeft") renderAlbum(index - 1);
    });

    function syncLiner() {
      liner.classList.toggle("open", document.activeElement === criteria || criteria.value.trim().length > 0);
    }
    criteria.addEventListener("focus", syncLiner);
    criteria.addEventListener("blur", syncLiner);
    criteria.addEventListener("input", syncLiner);

    play.addEventListener("click", () => {
      if (mode === "time") search();
    });
    again.addEventListener("click", restore);

    paint(45);
  </script>
</body>
</html>
